<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Workout Tracker</title>
    <link rel="icon" href="data:,">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💪 Gym Workout Tracker</h1>
            <p>Track your sets, reps, and weights</p>
            <div id="logout-container" style="display:none; text-align:center; margin: 10px 0;">
                <button class="btn danger" id="logout-btn">Logout</button>
            </div>
        </div>

        <div class="tabs" id="tabs" style="display:none;">
            <button class="tab active" onclick="switchTab('workout', this)">🏋️ Workout</button>
        </div>

        <div id="workout-tab" class="tab-content">
            <div class="day-selector" aria-label="Select workout day">
                <button class="day-btn active" onclick="selectDay('MON', this)" aria-label="Monday">MON</button>
                <button class="day-btn" onclick="selectDay('TUE', this)" aria-label="Tuesday">TUE</button>
                <button class="day-btn" onclick="selectDay('WED', this)" aria-label="Wednesday">WED</button>
                <button class="day-btn" onclick="selectDay('THU', this)" aria-label="Thursday">THU</button>
                <button class="day-btn" onclick="selectDay('FRI', this)" aria-label="Friday">FRI</button>
                <button class="day-btn" onclick="selectDay('SAT', this)" aria-label="Saturday">SAT</button>
            </div>
            <div class="controls">
                <button class="btn" id="save-btn" title="Save to cloud (requires login)">Save to Cloud</button>
                <button class="btn secondary" id="export-json-btn" title="Export workout as JSON">Export JSON</button>
                <button class="btn secondary" id="export-excel-btn" title="Export workout to Excel">Export Excel</button>
                <button class="btn danger" id="reset-btn" title="Clear current progress">Reset Progress</button>
            </div>
            <div id="workout-content"></div>
        </div>

        <div id="login-tab" class="tab-content active">
            <div class="login-box" role="form" aria-labelledby="login-title">
                <h2 id="login-title">Welcome back</h2>
                <p>Log in with your username to load your workouts, or continue as guest.</p>
                <div class="login-input-group">
                    <input type="text" id="username" placeholder="Enter username" aria-label="Username" autocomplete="username" required>
                </div>
                <button class="btn" id="login-btn">Login</button>
                <button class="btn secondary" id="guest-btn" style="margin-top:10px;">Continue as Guest</button>
                <div id="login-status" role="status" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
</body>
</html>
